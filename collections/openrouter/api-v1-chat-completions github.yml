          "content" : "fullstack-starter/.github/workflows/notify.yml:\nname: Notify (ntfy)\n\non:\n  workflow_call:\n    inputs:\n      environment:\n        description: 'Deployment environment name (e.g. stage, prod)'\n        required: true\n        type: string\n      status:\n        description: 'Result of the deploy job (success, failure, cancelled, skipped)'\n        required: true\n        type: string\n    secrets:\n      NTFY_URL:\n        description: 'Base URL of the ntfy server, e.g. https://ntfy.example.com'\n        required: true\n      NTFY_TOPIC:\n        description: 'Topic name to publish to'\n        required: true\n      NTFY_TOKEN:\n        description: 'ntfy access token (tk_...) with write access to the topic'\n        required: true\n\njobs:\n  notify:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Send ntfy deployment notification\n        env:\n          NTFY_URL: ${{ secrets.NTFY_URL }}\n          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}\n          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}\n          ENVIRONMENT: ${{ inputs.environment }}\n          STATUS: ${{ inputs.status }}\n          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n        run: |\n          if [[ \"$STATUS\" == \"success\" ]]; then\n            title=\"${ENVIRONMENT} deploy succeeded\"\n            priority=\"default\"\n            tags=\"white_check_mark,rocket\"\n          else\n            title=\"${ENVIRONMENT} deploy ${STATUS}\"\n            priority=\"high\"\n            tags=\"x,rotating_light\"\n          fi\n\n          curl -sSf \\\n            -H \"Authorization: Bearer ${NTFY_TOKEN}\" \\\n            -H \"Title: ${title}\" \\\n            -H \"Priority: ${priority}\" \\\n            -H \"Tags: ${tags}\" \\\n            -H \"Click: ${RUN_URL}\" \\\n            -d \"fullstack-starter ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}\" \\\n            \"${NTFY_URL%/}/${NTFY_TOPIC}\"\n",
