ocker-webhook`, который тупо шлёт POST-запрос на webhook-сервер с именем проекта и окружением. На сервере webhook ловит запрос и делает `docker compose pull` + `up -d` (образы уже должны быть собраны и запушены в registry к этому моменту). Архитектура на сервере — docker compose со следующими сервисами: - `db` (PostgreSQL) - `flyway` (миграции, запускается один раз при старте, ждёт db) - `backend` (Spring Boot, :8080, зависит от flyway) - `chat-collector` (собирает сообщения из чата, зависит от backend) - `frontend` (Next.js, :3000, проксирует `/api/*` на backend) Есть два оверлея: `docker-…\ntao[uid:581]: сега, как работает ntfy в той репе? в кратце\n\nRespond to this latest message from @tao:\nсега, как работает ntfy в той репе? в кратце"
