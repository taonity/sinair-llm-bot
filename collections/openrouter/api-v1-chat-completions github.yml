ANUAL_SKIP_APPROVAL: ${{ inputs.skip_approval || false }}\n      run: |\n        skip_approval=false\n\n        if [[ \"$MANUAL_SKIP_APPROVAL\" == \"true\" || \"$COMMIT_MESSAGE\" == *\"[skip approval]\"* ]]; then\n          skip_approval=true\n        fi\n\n        echo \"skip_approval=$skip_approval\" >> \"$GITHUB_OUTPUT\"\n        echo \"Release skip_approval=$skip_approval\"\n\n  backend-validation:\n    needs: prepare\n    if: needs.prepare.outputs.skip_tests != 'true'\n    uses: ./.github/workflows/backend-validation.yml\n\n  frontend-validation:\n    needs: prepare\n    if: needs.prepare.outputs.skip_tests != 'true'\n    uses: ./.github/workflows/frontend-validation.yml\n\n  release-prepare:\n    needs:\n      - prepare\n      - backend-validation\n      - frontend-validation\n    if: ${{ always() && (needs.prepare.outputs.skip_tests == 'true' || (needs.backend-validation.result == 'success' && needs.frontend-validation.result == 'success')) }}\n    permissions: write-all\n    runs-on: ubuntu-latest\n\n    outputs:\n      tag: ${{ steps.extract_tag.outputs.tag }}\n      raw_tag: ${{ steps.github_tag_action.outputs.new_tag }}\n\n    steps:\n    - uses: actions/checkout@v6\n\n    - name: Compute next version tag\n      id: github_tag_action\n      uses: anothrNick/github-tag-action@1.70.0\n      env:\n        GITHUB_TOKEN: ${{ secrets.TAGGING_GITHUB_TOKEN }}\n        WITH_V: true\n        DRY_RUN: true\n\n    - name: Extract tag\n      id: extract_tag\n      run: |\n        raw_tag=${{ steps.github_tag_action.outputs.new_tag  }}\n        tag=${raw_tag:1}\n        echo \"tag=$tag\" >> \"$GITHUB_OUTPUT\"\n        echo \"Successfully extracted tag $tag\"\n\n  release-backend:\n    needs: release-prepare\n    permissions: write-all\n    runs-on: ubuntu-latest\n\n    steps:\n    - uses: actions/checkout@v6\n\n    - name: Set up JDK 17\n      uses: actions/setup-java@v5\n      with:\n        java-version: '17'\n        distribution: 'temurin'\n        cache: maven\n\n    - name: Extract back-end maven artifactId\n      id: extract_backend_artifact_id\n      run: |\n        parentArtifactId=$(mvn -pl backend help:evaluate \"-Dexpression=project.parent.artifactId\" -q -DforceStdout)\n        artifactId=$\n... [truncated]",
