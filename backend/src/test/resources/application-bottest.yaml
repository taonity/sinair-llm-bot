spring:
  datasource:
    url: jdbc:h2:mem:bottest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  session:
    # This profile has no Flyway, so Spring Session creates its schema.
    jdbc:
      initialize-schema: embedded

app:
  llm:
    active-reply-tier: cheap
    gate-tier: gate
    tiers:
      gate:
        model: stub/gate
      cheap:
        model: stub/cheap
      smart:
        model: stub/smart
  bot:
    enabled: true
    rooms: '#chat'
    persona:
      name: segfault
      language: Russian
      prompt: classpath:prompts/persona-bottest.txt
    decision:
      debounce-seconds: 1
      cooldown-seconds: 1
      max-replies-per-window: 20
      window-minutes: 30
      spontaneous-probability: 0
    context:
      recent-message-count: 25
      summary-refresh-every-messages: 1000
      max-summary-chars: 1500
      max-message-chars: 600
