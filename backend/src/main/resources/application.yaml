server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 7d
      cookie:
        domain: ${SERVER_SERVLET_SESSION_COOKIE_DOMAIN}
        name: ${SERVER_SERVLET_SESSION_COOKIE_NAME}

app:
  minimised-http-servlet-logging: true
  csrf-cookie-name: ${CSRF_COOKIE_NAME}
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
  console:
    owner-emails: ${CONSOLE_OWNER_EMAILS}
    admin-emails: ${CONSOLE_ADMIN_EMAILS:}
    max-page-size: 100
  github:
    org: taonity
    token: ${GITHUB_TOKEN:}
    api-base-url: https://api.github.com
    user-agent: sinair-llm-bot
    fetch-timeout-seconds: 8
    mcp:
      enabled: ${GITHUB_MCP_ENABLED:true}
      base-url: https://api.githubcopilot.com
      endpoint: /mcp/
      request-timeout-seconds: 20
      read-tools:
        - search_code
        - get_file_contents
        - get_repository_tree
        - search_commits
        - get_commit
        - get_file_blame
        - search_issues
        - issue_read
        - search_pull_requests
        - pull_request_read
      write-enabled: ${GITHUB_MCP_WRITE_ENABLED:false}
      write-tools:
        - issue_write
        - add_issue_comment
        - create_pull_request
        - update_pull_request
        - pull_request_review_write
    repo-lookup:
      enabled: ${GITHUB_REPO_LOOKUP_ENABLED:true}
      max-search-results: 8
      max-file-chars: 20000
  llm:
    base-url: https://openrouter.ai/api/v1
    api-key: ${LLM_API_KEY}
    timeout-seconds: 30
    title: sinair-llm-bot
    active-reply-tier: ${LLM_ACTIVE_REPLY_TIER:smart-glm}
    gate-tier: gate
    critic-tier: critic
    retry:
      max-attempts: ${LLM_RETRY_MAX_ATTEMPTS:20}
      backoff-millis: ${LLM_RETRY_BACKOFF_MILLIS:1000}
      retry-provider-errors: ${LLM_RETRY_PROVIDER_ERRORS:true}
    reply-web-search: ${LLM_REPLY_WEB_SEARCH:true}
    tool-loop:
      tier: ""
      max-rounds: 35
    json-retry-attempts: 3
    critic:
      enabled: ${LLM_CRITIC_ENABLED:true}
      candidate-count: 2
      candidate-temperature: 0.35
      repair-threshold: 7
      prompt: classpath:prompts/reply-critic.txt
    tiers:
      gate:
        model: google/gemini-2.5-flash-lite
        temperature: 0
        max-tokens: 220
      cheap:
        model: deepseek/deepseek-chat
        temperature: 0.2
        max-tokens: 400
      smart-glm:
        model: z-ai/glm-5.2
        temperature: 0.2
        max-tokens: 1500
      # Sized to prevent multi-round tool calls from being truncated mid-emission.
      repo:
        model: z-ai/glm-5.2
        temperature: 0.2
        max-tokens: 1500
      critic:
        model: google/gemini-2.5-flash-lite
        temperature: 0
        max-tokens: 500
      vision:
        model: google/gemini-2.5-flash
        temperature: 0.7
        max-tokens: 500
  ingestion:
    enabled: ${INGESTION_ENABLED:true}
    max-urls-per-message: 3
    fetch-timeout-seconds: 8
    max-redirects: 4
    max-page-bytes: 2000000
    max-context-chars: 6000
    max-chars-per-source: 4000
    max-doc-links: 5
    vision-tier: vision
    image:
      max-bytes: 6000000
      extensions:
        - png
        - jpg
        - jpeg
        - gif
        - webp
        - bmp
  bot:
    enabled: ${BOT_ENABLED:true}
    rooms: '${BOT_ROOMS}'
    persona:
      name: segfault
      language: Russian
      creator-user-id: ${BOT_CREATOR_USER_ID}
      stop-command: '!stop'
      start-command: '!start'
      sleep-command: '!sleep'
      wake-command: '!wake'
      sleep-nick-suffix: '-zzz'
      aliases:
        - сега
        - сегвульт
      prompt: classpath:prompts/persona.txt
    decision:
      debounce-seconds: 6
      cooldown-seconds: 30
      max-replies-per-window: 8
      window-minutes: 20
      spontaneous-probability: 0
    context:
      recent-message-count: 25
      summary-refresh-every-messages: 40
      max-summary-chars: 2500
      # Russian summaries need roughly two tokens per Cyrillic character.
      summary-max-tokens: 6000
      max-message-chars: 1500
      session-gap-minutes: 45
    typing:
      # Auto-clears stalled reply generation that would otherwise leave typing stuck on.
      ttl-seconds: 120
    limits:
      max-reply-chars: 4000
      trace-trigger-text-max: 2000
      event-scan-limit: 120
      summary-history-versions: 9
      link-context-messages: 5

  retention:
    chat:
      retention-days: 7
      cron: "0 0 3 * * *"
    audit:
      retention-days: 14
      cron: "0 30 3 * * *"

# Resolved at runtime because the same image is deployed to stage and production.
info:
  app:
    name: ${spring.application.name}
    environment: ${APP_ENVIRONMENT:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      cache:
        time-to-live: 60s
      group:
        external:
          include: google
    prometheus:
      enabled: true
  info:
    env:
      enabled: true
    git:
      enabled: true
      mode: full
    build:
      enabled: true
  metrics:
    tags:
      application: sinair-llm-bot

spring:
  profiles:
    group:
      local: plain-log
  application:
    name: sinair-llm-bot
  session:
    # Flyway owns the Spring Session schema.
    jdbc:
      initialize-schema: never

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        git_commit: "@git.commit.id.abbrev@"
        app_version: "@project.version@"
        service: ${spring.application.name}
      stacktrace:
        root: first
        max-length: 2048
        include-common-frames: false
        include-hashes: true
  level:
    WireMock: warn
