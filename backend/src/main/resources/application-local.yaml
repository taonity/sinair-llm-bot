---
logging:
  level:
    org.taonity.sinairllmbot.web.exception.GlobalExceptionHandler: debug
    DB: info

server:
  servlet:
    session:
      cookie:
        domain: 127.0.0.1
        name: JSESSIONID-LOCAL

spring:
  security:
    oauth2:
      client:
        registration:
          google-sinair-llm-bot:
            redirect-uri: http://127.0.0.1:8080/login/oauth2/code/google-sinair-llm-bot
  jpa:
    properties:
      hibernate:
        format_sql: true

app:
  csrf-cookie-name: XSRF-TOKEN-LOCAL
  cookie:
    secure: false
    same-site: Lax
  llm:
    base-url: https://openrouter.ai/api/v1
    api-key: ${LLM_API_KEY:local-dummy-key}
    active-reply-tier: cheap
  bot:
    rooms: '#taonity-room'
    persona:
      name: segfault-local
      creator-user-id: ${BOT_CREATOR_USER_ID:0}

decorator:
  datasource:
    datasource-proxy:
      logging: slf4j
      query:
        enable-logging: false
        log-level: info
        logger-name: DB
      slow-query:
        enable-logging: true
        log-level: info
        logger-name: DB
        threshold: 300
      multiline: false
      format-sql: true
      json-format: false
      count-query: false
